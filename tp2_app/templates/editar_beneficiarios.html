{% extends 'navbar.html' %}

{% block title %}Editar Beneficiario{% endblock %}

{% block content %}
<div class="row justify-content-center mt-4 mb-5">
    <div class="col-12 col-md-8 col-lg-7">
        
        <div class="card shadow p-4 bg-white rounded">
            <h3 class="text-center mb-4 fw-bold text-primary fs-3 text-uppercase">
                <i class="bi bi-pencil-square me-2"></i>Editar Beneficiario
            </h3>

            <form method="post" novalidate>
                {% csrf_token %}

                <h5 class="text-secondary fw-semibold border-bottom pb-2 mb-3">
                    <i class="bi bi-person-badge me-2"></i>Datos Personales
                </h5>
                {% bootstrap_form form_persona %}

                <h5 class="text-secondary fw-semibold border-bottom pb-2 mb-3 mt-4">
                    <i class="bi bi-file-earmark-text me-2"></i>Datos del Beneficiario
                </h5>
                {% bootstrap_form form_beneficiario %}

                <div class="d-flex gap-2 mt-4">
                    <button type="submit" class="btn btn-primary w-50 fw-bold text-uppercase py-2">
                        Guardar Cambios
                    </button>
                    <a href="{% url 'lista_beneficiarios' %}" class="btn btn-secondary w-50 fw-bold text-uppercase py-2">
                        Cancelar
                    </a>
                </div>
            </form>

        </div>
    </div>
</div>
{% endblock %}
