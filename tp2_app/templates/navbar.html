<!DOCTYPE html>
<html lang="es">
<head>
    <title>{% block title %}Sistema Bancario{% endblock %}</title>
    {% load django_bootstrap5 %} 
    {% bootstrap_css %} 
    {% bootstrap_javascript %} 
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Barra de navegación -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <!-- Título -->
            <a class="navbar-brand fw-bold" href="/">
                <i class="bi bi-bank me-2"></i>
            </a>
            
            <button class="navbar-toggler ms-auto" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="collapse navbar-collapse" id="navbarNav">
                <!-- Solo se muestra si la sesion esta activa-->
                {% if request.session.username %}
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link fw-semibold fs-5 text-white" href="{% url 'lista_beneficiarios' %}">Beneficiarios</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link fw-semibold fs-5 text-white" href="#">Estados de Cuenta</a>
                    </li>
                </ul>
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item d-flex align-items-center text-white me-3">
                        <i class="bi bi-person-circle me-2 fs-5"></i>
                        <span class="fw-semibold fs-5">{{ request.session.username }}</span>
                    </li>
                    <li class="nav-item">
                        <a class="btn btn-danger fw-semibold text-white" href="#">Cerrar Sesión</a>
                    </li>
                </ul>
                {% endif %}
            </div>
        </div>
    </nav>
    
    <div class="container mt-3">
        {% block content %}
        {% endblock %}
    </div>

</body>
</html>
