<!DOCTYPE html>
<html lang="es">
<head>
    <title>{% block title %}Iniciar Sesión{% endblock %}</title>
    {% load django_bootstrap5 %} 
    {% bootstrap_css %} 
    {% bootstrap_javascript %} 
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
</head>

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-12 col-md-6 col-lg-5">
        <div class="card shadow p-4 bg-white rounded mb-4">
            
            <h3 class="text-center mb-4 fw-bold text-primary fs-3 text-uppercase">
                <i class="bi bi-box-arrow-in-right me-2"></i>Iniciar Sesión
            </h3>

            <form id="formLogin" action="{% url 'login' %}" method="POST">
                {% csrf_token %}

                <div class="mb-3">
                    <label for="username" class="form-label fw-semibold fs-5">
                        <i class="bi bi-person-fill me-2 fs-4 align-middle"></i>
                        <span class="align-middle">Usuario:</span>
                    </label>
                    <input name="username" type="text" class="form-control" id="username">
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label fw-semibold fs-5">
                        <i class="bi bi-key-fill me-2 fs-4 align-middle"></i>
                        <span class="align-middle">Contraseña:</span>
                    </label>
                    <input name="password" type="password" class="form-control" id="password">
                </div>

                <button type="submit" class="btn btn-primary w-100 fw-bold text-uppercase py-2">
                    Ingresar
                </button>

                <div class="mt-3" id="seccionErrores">
                    {% if messages %} 
                        {% for message in messages %}
                        <div class="alert alert-danger d-flex align-items-start" role="alert">
                            <i class="bi bi-exclamation-circle-fill me-2 fs-5"></i>
                            <div>
                                <strong>Error:</strong> {{ message }}
                            </div>
                        </div>
                        {% endfor %}
                    {% endif %}
                </div>
            </form>

            <script>
                document.getElementById('formLogin').addEventListener('submit', function (event) {
                    event.preventDefault();

                    const txtUsuario = document.getElementById('username').value.trim();
                    const txtClave = document.getElementById('password').value.trim();
                    const divErrores = document.getElementById('seccionErrores');
                    
                    divErrores.innerHTML = "";

                    if (txtUsuario !== "" && txtClave !== "") {
                        this.submit();
                        return;
                    }

                    divErrores.innerHTML = `
                        <div class="alert alert-danger d-flex align-items-start" role="alert">
                            <i class="bi bi-exclamation-circle-fill me-2 fs-5"></i>
                            <div>
                                <strong>Error:</strong>
                                <ul class="mb-0 mt-1 ps-3">
                                    <li>Debe ingresar su usuario y contraseña para continuar.</li>
                                </ul>
                            </div>
                        </div>
                    `;
                });
            </script>

        </div>
    </div>
</div>
{% endblock %}
