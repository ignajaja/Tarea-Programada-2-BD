{% extends 'navbar.html' %}
{% load django_bootstrap5 %}

{% block content %}


<div class="row justify-content-center mt-4 mb-5">
    <div class="col-12 col-md-8 col-lg-7">
        
        <div class="card shadow p-4 bg-white rounded">
            <h3 class="text-center mb-4 fw-bold text-primary fs-3 text-uppercase">
                <i class="bi bi-pencil-square me-2"></i>Agregar beneficiario
            </h3>

            {% for message in messages %}

            <div class="alert {% if message.tags == 'success' %}alert-success{% else %}alert-danger{% endif %}">{{ message }}</div>
            
            {% endfor %}

            <form method="post" novalidate">
                {% csrf_token %}
                {% bootstrap_form form label_class="fw-bold" %}

                <div class="d-flex gap-2 mt-3">
                    <button type="submit" class="btn btn-primary">Agregar</button>
                    <a href="{% url 'lista_beneficiarios' %}" class="btn btn-secondary">Cancelar</a>

                </div>

            </form>
        </div>
    </div>
</div>
{% endblock %}
